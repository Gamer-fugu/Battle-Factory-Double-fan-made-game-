                  const key = `player-${pos}`;

                  const animCls = state.animFlags[key] || (mon && !mon.fainted ? 'anim-idle' : '');

                  const auraCls = mon && !mon.fainted && mon.status ? `aura-${mon.status}` : '';

                  const isAllyTarget = canTargetAlly && pos !== state.selectingSlotPos;

                  const pop = state.popups[key];

                  return `

                    <div class="flex flex-col gap-1.5">

                      <div ${isAllyTarget && mon && !mon.fainted ? `onclick="selectTarget('player', ${pos})"` : ''}

                        class="h-24 rounded-2xl arena-platform-ally flex items-center justify-center relative ${isAllyTarget && mon && !mon.fainted ? 'cursor-pointer ring-2 ring-amber-400/70' : ''}">

                        ${pop ? `<div class="absolute top-1 left-1/2 z-30 font-mono font-black text-xs ${pop.color} drop-shadow anim-popup">${pop.text}</div>` : ''}

                        ${mon && !mon.fainted ? `

                          <img src="${getSpriteUrl(mon.id, true)}" alt="${mon.name}"

                            class="w-24 h-24 object-contain drop-shadow-lg ${animCls} ${auraCls}"

                            onerror="this.src='https://placehold.co/80x80/0f172a/10b981?text=${encodeURIComponent(mon.name.slice(0,4))}'">

                        ` : `<span class="text-[11px] text-slate-600 font-semibold">Fainted</span>`}

                      </div>

                      ${renderMonHudCard(mon, 'player', pos, isAllyTarget)}

                    </div>

                  `;

                }).join('')}

              </div>

            </div>



            <!-- Right Column: Opponent Roster Intel & Live Battle Log -->

            <div class="md:col-span-4 flex flex-col gap-2.5 h-full max-h-[350px]">

              <div class="p-2.5 rounded-2xl bg-slate-900/85 border border-slate-800">

                <div class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">

                  Opponent 4-Pokémon Roster

                </div>

                <div class="grid grid-cols-2 gap-1.5">

                  ${state.enemyTeam.map(m => {

                    if (!m.revealed) {

                      return `

                        <div class="px-2 py-1.5 rounded-xl bg-indigo-950/40 border border-indigo-500/30 flex items-center gap-1.5 text-[11px] text-indigo-300 font-bold">

                          <span class="w-4 h-4 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[9px]">?</span>

                          <span>Hidden Reserve</span>

                        </div>

                      `;

                    }

                    return `

                      <div class="px-2 py-1.5 rounded-xl bg-slate-950/80 border border-slate-800 flex items-center justify-between text-[11px] ${m.fainted ? 'opacity-45 line-through text-slate-500' : 'text-slate-200 font-semibold'}">

                        <span class="truncate">${m.name}</span>

                        <span class="text-[9px] font-mono ${m.fainted ? 'text-rose-400' : 'text-emerald-400'}">${m.fainted ? 'FNT' : Math.ceil((m.hp/m.maxHp)*100)+'%'}</span>

                      </div>

                    `;

                  }).join('')}

                </div>

              </div>



              <div id="battle-log-box" class="flex-1 p-3 rounded-2xl bg-slate-950/85 border border-slate-800 overflow-y-auto space-y-1.5 text-xs">

                ${state.logs.map(l => `<div class="${l.colorClass} leading-snug">› ${l.msg}</div>`).join('')}

              </div>

            </div>

          </div>



          <!-- Bottom Command Deck -->

          <div class="px-5 py-3 bg-slate-900/95 border-t border-slate-800">

            ${renderCommandDeck()}

          </div>



          ${state.promptQueue.length > 0 ? renderSwitchPromptModal() : ''}

        </div>

      `;

    }



    function renderCommandDeck() {

      if (state.animating) {

        return `

          <div class="h-24 flex items-center justify-center text-sm font-bold text-cyan-300 animate-pulse">

            Executing Doubles Turn...

          </div>

        `;

      }



      const activeMon = getActiveMon('player', state.selectingSlotPos);

      if (!activeMon || activeMon.fainted) {

        return `<div class="h-24 flex items-center justify-center text-xs text-slate-400">Waiting for active slot...</div>`;

      }



      const benchIndices = getAvailableBenchIndices('player');

      const otherPos = state.selectingSlotPos === 0 ? 1 : 0;

      const otherAct = state.pendingActions[otherPos];

      const eligibleForMega = canMonMegaEvolve(activeMon);

      const megaInfo = MEGA_FORMS[activeMon.baseName];



      if (state.uiSubMode === 'TARGET') {

        const chosenMv = state.selectedMoveName ? MOVES[state.selectedMoveName] : null;

        const ally = getActiveMon('player', otherPos);

        const canTargetPartner = ally && !ally.fainted && chosenMv && (chosenMv.target === 'foe' || chosenMv.target === 'any');

        return `

          <div class="h-24 flex flex-col justify-between">

            <div class="flex items-center justify-between">

              <span class="text-xs font-extrabold text-amber-300">

                Select Target for ${activeMon.name}'s ${state.selectedMoveName} ${state.megaWant && eligibleForMega ? `<span class="text-fuchsia-300">(+ Mega Evolve!)</span>` : ''}:

              </span>

              <button onclick="state.uiSubMode='MAIN'; state.megaWant=false; render();" class="px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 cursor-pointer">

                ← Back to Moves

              </button>

            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">

              ${[0, 1].map(pos => {

                const foe = getActiveMon('enemy', pos);

                if (!foe || foe.fainted) return '';

                const eff = getTypeEffectiveness(MOVES[state.selectedMoveName].type, foe.types);

                const effLabel = eff > 1 ? 'Super Effective' : eff === 0 ? 'Immune' : eff < 1 ? 'Not Very Effective' : 'Neutral';

                return `

                  <button onclick="selectTarget('enemy', ${pos})"

                    class="p-2.5 rounded-xl bg-rose-950/50 hover:bg-rose-900/70 border border-rose-500/40 text-left transition cursor-pointer">

                    <div class="font-extrabold text-xs text-white">🎯 Target Foe ${pos + 1}: ${foe.name}</div>

                    <div class="text-[10px] text-amber-300 mt-0.5">${effLabel} (${eff}x)</div>

                  </button>

                `;

              }).join('')}

              ${canTargetPartner ? (() => {

                const eff = getTypeEffectiveness(MOVES[state.selectedMoveName].type, ally.types);

                const subText = chosenMv?.pollenPuff

                  ? 'Heal 50% Max HP'

                  : chosenMv?.cat === 'Status'

                    ? 'Apply Status / Effect to Partner'

                    : `Hit Partner (${eff}x)`;

                return `

                  <button onclick="selectTarget('player', ${otherPos})"

                    class="p-2.5 rounded-xl bg-emerald-950/50 hover:bg-emerald-900/70 border border-emerald-500/40 text-left transition cursor-pointer">

                    <div class="font-extrabold text-xs text-white">🤝 Target Partner (${ally.name})</div>

                    <div class="text-[10px] text-emerald-300 mt-0.5">${subText}</div>

                  </button>

                `;

              })() : ''}

            </div>

          </div>

        `;

      }



      if (state.uiSubMode === 'SWITCH') {

        return `

          <div class="h-24 flex flex-col justify-between">

            <div class="flex items-center justify-between">

              <span class="text-xs font-extrabold text-cyan-300">Switch ${activeMon.name} with a Reserve Pokémon:</span>

              <button onclick="state.uiSubMode='MAIN'; render();" class="px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 cursor-pointer">

                ← Back to Moves

              </button>

            </div>

            <div class="grid grid-cols-2 gap-3">

              ${benchIndices.length === 0 ? `<div class="text-xs text-slate-400">No healthy reserve Pokémon available!</div>` : benchIndices.map(bIdx => {

                const bMon = state.playerTeam[bIdx];

                const alreadyPicked = otherAct && otherAct.type === 'SWITCH' && otherAct.toTeamIdx === bIdx;

                return `

                  <button onclick="selectBenchSwitch(${bIdx})" ${alreadyPicked ? 'disabled' : ''}

                    class="p-2.5 rounded-xl border text-left flex items-center justify-between transition ${alreadyPicked ? 'bg-slate-900 border-slate-800 opacity-45 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-700 border-slate-600 cursor-pointer'}">

                    <div>

                      <div class="font-extrabold text-xs text-white">${bMon.name} ${alreadyPicked ? '(Selected by Partner)' : ''}</div>

                      <div class="text-[10px] text-slate-400">${bMon.ability} • ${bMon.item.name}</div>

                    </div>

                    <span class="text-xs font-mono font-bold text-emerald-400">${bMon.hp}/${bMon.maxHp} HP</span>

                  </button>

                `;

              }).join('')}

            </div>

          </div>

        `;

      }



      return `

        <div class="flex flex-col gap-2">

          <div class="flex flex-wrap items-center justify-between gap-2">

            <div class="flex items-center gap-2">

              <span class="px-2 py-0.5 rounded-lg text-[10px] font-black bg-emerald-500 text-slate-950">

                SLOT ${state.selectingSlotPos + 1} (${state.selectingSlotPos === 0 ? 'LEFT' : 'RIGHT'})

              </span>

              <span class="text-xs font-extrabold text-white">What will ${activeMon.name} do?</span>

            </div>



            <div class="flex items-center gap-2">

              ${eligibleForMega ? `

                <button onclick="toggleMegaWant()"

                  class="px-3.5 py-1 rounded-xl border text-xs font-black transition flex items-center gap-1.5 shadow cursor-pointer ${

                    state.megaWant

                      ? 'bg-gradient-to-r from-fuchsia-600 to-pink-500 border-fuchsia-300 text-white ring-2 ring-fuchsia-400/50'

                      : 'bg-slate-800 hover:bg-slate-750 border-fuchsia-500/40 text-fuchsia-300'

                  }">

                  <span>🧬 Mega Evolve (${megaInfo.megaName}):</span>

                  <span class="px-1.5 py-0.2 rounded bg-black/30 text-[10px]">${state.megaWant ? 'ON ✓' : 'OFF'}</span>

                </button>

              ` : ''}



              ${state.selectingSlotPos === 1 && state.pendingActions[0] ? `

                <button onclick="cancelBackToSlot0()" class="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-[11px] font-bold text-amber-300 cursor-pointer">

                  ↺ Undo Slot 1

                </button>

              ` : ''}



              <button onclick="state.uiSubMode='SWITCH'; state.megaWant=false; render();" ${benchIndices.length === 0 ? 'disabled' : ''}

                class="px-3 py-1 rounded-xl border text-xs font-bold transition ${benchIndices.length > 0 ? 'bg-indigo-600/30 hover:bg-indigo-600/50 border-indigo-400/50 text-indigo-200 cursor-pointer' : 'bg-slate-800 border-slate-700 text-slate-500 cursor-not-allowed'}">

                ⇄ Switch Bench (${benchIndices.length})

              </button>

            </div>

          </div>



          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">

            ${activeMon.moves.map(mName => {

              const mv = MOVES[mName] || { type: 'Normal', cat: 'Physical', pow: 60, target: 'foe' };

              const bg = TYPE_COLORS[mv.type] || '#475569';

              const targetTag = mv.target === 'allFoes' ? 'Spread Foes' : mv.target === 'allOthers' ? 'All Others' : mv.target === 'ally' ? 'Partner' : mv.target === 'self' || mv.target === 'field' ? 'Self/Field' : 'Single / Partner';

              const locked = isMoveDisabledForMon(activeMon, mName);

              const isChoiceLockedThis = isChoiceItem(activeMon.item) && activeMon.choiceLockedMove === mName;

              const isEncoredThis = activeMon.encoredMove === mName && activeMon.encoreTurns > 0;

              const safeMoveArg = mName.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

              return `

                <button type="button" onclick="selectMove('${safeMoveArg}')" ${locked ? 'disabled' : ''}

                  class="p-2.5 rounded-xl border text-left transition flex flex-col justify-between shadow ${

                    locked

                      ? 'bg-slate-950/70 border-slate-800/80 opacity-45 cursor-not-allowed'

                      : `bg-slate-800/90 hover:bg-slate-700 ${state.megaWant && eligibleForMega ? 'border-fuchsia-500/50' : isChoiceLockedThis || isEncoredThis ? 'border-amber-400/70' : 'border-slate-700'} hover:border-white/40 cursor-pointer`

                  }">

                  <div class="flex items-center justify-between gap-1">

                    <span class="font-extrabold text-xs text-white truncate">${mName}</span>

                    <div class="flex items-center gap-1 shrink-0">

                      ${locked ? `<span class="px-1.5 py-0.5 rounded text-[8px] font-black bg-rose-500/25 text-rose-300 border border-rose-500/40">LOCKED</span>` : ''}

                      ${isChoiceLockedThis ? `<span class="px-1.5 py-0.5 rounded text-[8px] font-black bg-amber-500/25 text-amber-300 border border-amber-500/40">CHOICE</span>` : ''}

                      <span class="px-1.5 py-0.5 rounded text-[9px] font-bold text-white" style="background:${bg}">${mv.type}</span>

                    </div>

                  </div>

                  <div class="flex items-center justify-between text-[10px] text-slate-400 mt-1.5">

                    <span>${mv.cat} • ${mv.pow > 0 ? mv.pow + ' BP' : 'Status'}</span>

                    <span class="text-cyan-300 font-semibold">${targetTag}</span>

                  </div>

                </button>

              `;

            }).join('')}

          </div>

        </div>

      `;

    }



    function renderSwitchPromptModal() {

      const prompt = state.promptQueue[0];

      const benchIndices = getAvailableBenchIndices('player');

      return `

        <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-30">

          <div class="w-full max-w-md p-5 rounded-3xl bg-slate-900 border border-emerald-500/40 shadow-2xl">

            <h3 class="text-base font-extrabold text-white">

              ${prompt.reason === 'pivot' ? 'Pivot Switch-Out! Choose Next Pokémon' : 'Pokémon Fainted! Send Out Reserve'}

            </h3>

            <p class="text-xs text-slate-400 mt-1 mb-4">

              Select which reserve Pokémon enters Slot ${prompt.slotPos + 1}:

            </p>

            <div class="space-y-2.5">

              ${benchIndices.map(bIdx => {

                const mon = state.playerTeam[bIdx];

                return `

                  <button onclick="confirmPromptSwitch(${bIdx})"

                    class="w-full p-3 rounded-2xl bg-slate-800 hover:bg-emerald-950/50 border border-slate-700 hover:border-emerald-400 flex items-center justify-between transition cursor-pointer">

                    <div class="flex items-center gap-3">

                      <img src="${getSpriteUrl(mon.id)}" alt="${mon.name}" class="w-12 h-12 object-contain">

                      <div class="text-left">

                        <div class="font-extrabold text-sm text-white">${mon.name}</div>

                        <div class="text-[11px] text-amber-300">${mon.ability} • ${mon.item.name}</div>

                      </div>

                    </div>

                    <span class="text-xs font-mono font-bold text-emerald-400">${mon.hp}/${mon.maxHp} HP</span>

                  </button>

                `;

              }).join('')}

            </div>

          </div>

        </div>

      `;

    }



    // --- SCREEN 3: POST-BATTLE SWAP ---

    function renderSwapScreen() {

      const revealedEnemies = state.enemyTeam.filter(m => m.revealed);

      const hiddenCount = state.enemyTeam.length - revealedEnemies.length;



      return `

        ${renderHeader()}

        <div class="flex-1 p-5 flex flex-col justify-between overflow-y-auto">

          <div>

            <div class="flex flex-wrap items-center justify-between gap-2 mb-4">

              <div>

                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">

                  VICTORY • ROUND ${state.streak} CLEARED

                </span>

                <h2 class="text-lg font-extrabold text-white mt-1">Post-Battle Factory Trade</h2>

                <p class="text-xs text-slate-400">

                  Swap 1 of your Pokémon with an opponent Pokémon revealed in battle${hiddenCount > 0 ? ` (${hiddenCount} unrevealed reserve${hiddenCount > 1 ? 's' : ''} stay hidden)` : ''}, or keep your current squad.

                </p>

              </div>

              <button onclick="startNextBattle()"

                class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs shadow-lg transition cursor-pointer">

                Keep Squad & Next Round →

              </button>

            </div>



            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

              <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800">

                <h3 class="text-xs font-extrabold uppercase tracking-wider text-sky-300 mb-3">

                  1. Revealed Opponent Pokémon (Tap to Select)

                </h3>

                <div class="space-y-2.5">

                  ${state.enemyTeam.map((mon, idx) => {

                    if (!mon.revealed) {

                      return `

                        <div class="p-3 rounded-xl bg-indigo-950/30 border border-dashed border-indigo-500/30 flex items-center gap-3 opacity-75">

                          <div class="w-11 h-11 rounded-xl bg-indigo-900/50 flex items-center justify-center font-black text-indigo-300">?</div>

                          <div>

                            <div class="font-bold text-xs text-indigo-200">Unrevealed Reserve Pokémon</div>

                            <div class="text-[10px] text-indigo-400">Never entered the arena — cannot be traded</div>

                          </div>

                        </div>

                      `;

                    }

                    const selected = state.selectedSwapEnemyIdx === idx;

                    return `

                      <div onclick="state.selectedSwapEnemyIdx = ${idx}; render();"

                        class="p-3 rounded-xl border cursor-pointer transition flex items-center justify-between ${selected ? 'bg-sky-950/50 border-sky-400 ring-2 ring-sky-400/40' : 'bg-slate-950/70 border-slate-800 hover:border-slate-600'}">

                        <div class="flex items-center gap-3">

                          <img src="${getSpriteUrl(mon.baseId)}" alt="${mon.baseName}" class="w-12 h-12 object-contain">

                          <div>

                            <div class="font-extrabold text-xs text-white">${mon.baseName}</div>

                            <div class="text-[10px] text-amber-300">${mon.baseAbility} • ${mon.item.name}</div>

                            <div class="text-[10px] text-slate-400 mt-0.5">${mon.moves.join(' • ')}</div>

                          </div>

                        </div>

                        <span class="text-[10px] font-bold px-2 py-1 rounded-lg ${selected ? 'bg-sky-400 text-slate-950' : 'bg-slate-800 text-slate-300'}">

                          ${selected ? 'Selected' : 'Pick'}

                        </span>

                      </div>

                    `;

                  }).join('')}

                </div>

              </div>



              <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800">

                <h3 class="text-xs font-extrabold uppercase tracking-wider text-emerald-300 mb-3">

                  2. Your 4-Pokémon Squad ${state.selectedSwapEnemyIdx !== null ? '(Tap One to Replace)' : '(Select an Opponent Mon First)'}

                </h3>

                <div class="space-y-2.5">

                  ${state.playerTeam.map((mon, idx) => {

                    const canSwap = state.selectedSwapEnemyIdx !== null;

                    return `

                      <div ${canSwap ? `onclick="executePostBattleSwap(${idx})"` : ''}

                        class="p-3 rounded-xl border transition flex items-center justify-between ${canSwap ? 'bg-slate-950/80 border-emerald-500/40 hover:bg-emerald-950/40 cursor-pointer' : 'bg-slate-950/50 border-slate-800 opacity-80'}">

                        <div class="flex items-center gap-3">

                          <img src="${getSpriteUrl(mon.baseId)}" alt="${mon.baseName}" class="w-12 h-12 object-contain">

                          <div>

                            <div class="font-extrabold text-xs text-white">${mon.baseName} <span class="text-[10px] text-slate-400">(${idx < 2 ? 'Lead' : 'Reserve'})</span></div>

                            <div class="text-[10px] text-amber-300">${mon.baseAbility} • ${mon.item.name}</div>

                            <div class="text-[10px] text-slate-400 mt-0.5">${mon.moves.join(' • ')}</div>

                          </div>

                        </div>

                        ${canSwap ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-500 text-slate-950 font-extrabold text-[10px]">Swap In →</span>` : ''}

                      </div>

                    `;

                  }).join('')}

                </div>

              </div>

            </div>

          </div>

        </div>

      `;

    }



    // --- SCREEN 4: DEFEAT ---

    function renderDefeatScreen() {

      return `

        ${renderHeader()}

        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">

          <div class="w-16 h-16 rounded-2xl bg-rose-500/20 border border-rose-500/40 flex items-center justify-center text-3xl mb-4">

            🏆

          </div>

          <h2 class="text-2xl font-black text-white">Battle Factory Run Ended</h2>

          <p class="text-sm text-slate-400 mt-1 max-w-md">

            Defeated by ${state.trainer.title} ${state.trainer.name} after achieving a <span class="text-amber-300 font-bold">${state.streak}-win streak</span> in Reg M-C Doubles!

          </p>

          <button onclick="initDraft()"

            class="mt-6 px-6 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm shadow-lg transition cursor-pointer">

            Start New Rental Challenge

          </button>

        </div>

      `;

    }



    function render() {

      const app = document.getElementById('app');

      if (!app) return;

      if (state.screen === 'DRAFT') app.innerHTML = renderDraftScreen();

      else if (state.screen === 'BATTLE') app.innerHTML = renderBattleScreen();

      else if (state.screen === 'SWAP') app.innerHTML = renderSwapScreen();

      else if (state.screen === 'DEFEAT') app.innerHTML = renderDefeatScreen();

    }



    window.onload = () => {

      initDraft();

    };

  </script>

</body>

</html>
